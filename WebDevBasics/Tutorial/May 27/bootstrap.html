<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>

<body>
    <nav class="navbar bg-light navbar-expand-sm">
        <ul class="navbar-nav">
            <li class="nav-item"> <a class="nav-link" href="">Home</a></li>
            <li class="nav-item"> <a class="nav-link" href="">About</a></li>
            <li class="nav-item"> <a class="nav-link" href="">Contact</a></li>
    </ul>
    </nav>
    
    <div class="container pt-5" style="background-color: yellow;">
        <div class="btn-group-vertical">
            <button class="btn btn-primary">Click Me</button>
            <button type="button" class="btn btn-outline-success">Success</button>
            <button type="button" class="btn btn-warning">Warning</button>

        </div>
        <div class="progress m-2">
            <div class="progress-bar" style="width:70%;">70%</div>

        </div>

        <div>
            <ul class="pagination">
                <li class="page-item"> <a class="page-link" href="#">Previous</a></li>
                <li class="page-item"> <a class="page-link" href="#">1</a></li>
                <li class="page-item"> <a class="page-link" href="#">2</a></li>
                <li class="page-item"> <a class="page-link" href="#">Next</a></li>
            </ul>
        </div>

        <div class="alert alert-success alert-dismissible">
            <button type="button" data-bs-dismiss="alert" class="button-close"></button>
            <strong>Success!</strong> This alert box indicates a successful action

        </div>

        <div class="mb-3 w-50 p-3">
            <label for="" class="form-label">Password:</label>
            <input type="password" class="form-control">

        </div>

        <div class="mb-3 w-50 p-3">
            <label for="" class="form-label">Password:</label>
            <input type="password" class="form-control">

        </div>

        <div class="mb-3 w-50 p-3">
            <label for="" class="form-label">Username:</label>
            <input type="text" class="form-control">

        </div>


        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#my_modal">Modal</button>

        <div class="modal" id="my_modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Sign in</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3 w-50 p-3">
                            <label for="" class="form-label">Username:</label>
                            <input type="text" class="form-control">

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>


    </div>
</body>

</html>
