<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        $(document).ready(function() {
            $('.number').click(function() {
                $('#screen').val($('#screen').val() + $(this.text()))
            });
        });

    </script>
</body>
